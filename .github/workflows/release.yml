name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make build
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - run: go run ./cmd/analyzer replay --dataset testdata/replay --json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action defaults to flavor latest=auto: non-prerelease semver tags also get :latest; rc/beta tags never move it.
      - uses: docker/metadata-action@v5
        id: meta-analyzer
        with:
          images: ghcr.io/twjohnwu/releaseguard-analyzer
          tags: |
            type=semver,pattern={{version}}

      - name: Build analyzer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.analyzer
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta-analyzer.outputs.tags }}
          labels: ${{ steps.meta-analyzer.outputs.labels }}

      - uses: docker/metadata-action@v5
        id: meta-indexer
        with:
          images: ghcr.io/twjohnwu/releaseguard-indexer
          tags: |
            type=semver,pattern={{version}}

      - name: Build indexer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.indexer
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta-indexer.outputs.tags }}
          labels: ${{ steps.meta-indexer.outputs.labels }}

      - name: Push analyzer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.analyzer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-analyzer.outputs.tags }}
          labels: ${{ steps.meta-analyzer.outputs.labels }}

      - name: Push indexer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.indexer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-indexer.outputs.tags }}
          labels: ${{ steps.meta-indexer.outputs.labels }}
